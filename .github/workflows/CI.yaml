name: CI

on:
  - push

jobs:
  Check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Nix
        uses: cachix/install-nix-action@v31
      - name: Cache
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Check
        run: nix flake check -L

  Build:
    needs: [Check]
    strategy:
      fail-fast: false
      matrix:
        target:
          - double: aarch64-linux
            runner: ubuntu-24.04-arm
            flake: d4-static
          - double: x86_64-linux
            runner: ubuntu-24.04
            flake: d4-static
          - double: aarch64-darwin
            runner: macos-26
            flake: d4-static
          - double: x86_64-darwin
            runner: macos-26-intel
            flake: d4-static
          # TODO: Windows build is currently broken
          # - double: x86_64-windows
          #   runner: ubuntu-24.04
          #   flake: d4-windows
    runs-on: ${{ matrix.target.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Nix
        uses: cachix/install-nix-action@v31
      - name: Cache
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build
        run: nix build -L .#${{ matrix.target.flake }}
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: d4-${{ matrix.target.double }}
          path: result

  Container:
    needs: [Build]
    strategy:
      matrix:
        target:
          - double: aarch64-linux
            architecture: arm64
            runner: ubuntu-24.04-arm
          - double: x86_64-linux
            architecture: amd64
            runner: ubuntu-24.04
    env:
      REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
      IMAGE_NAME: ${{ vars.CONTAINER_IMAGE }}
      TAG: ${{ github.ref_name }}
    runs-on: ${{ matrix.target.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Nix
        uses: cachix/install-nix-action@v31
      - name: Cache
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build
        run: nix build -L .#packages.${{ matrix.target.double }}.container
      - name: Login
        run: skopeo login $REGISTRY --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: skopeo copy docker-archive:result docker://$REGISTRY/$IMAGE_NAME:$TAG-${{ matrix.target.architecture }}
      - name: Push latest tag
        if: ${{ github.ref_type == 'tag' }}
        run: skopeo copy docker://$REGISTRY/$IMAGE_NAME:$TAG-${{ matrix.target.architecture }} docker://$REGISTRY/$IMAGE_NAME:latest-${{ matrix.target.architecture }}
